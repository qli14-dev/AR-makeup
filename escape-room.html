<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Mystery Adventure Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        /* Dark and tense theme */
        .escape-room {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }

        /* Intro Screen */
        .escape-room.intro {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0000, #000000);
            animation: pulse-bg 3s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0%, 100% { filter: brightness(0.8); }
            50% { filter: brightness(1); }
        }

        .intro-content {
            text-align: center;
            padding: 3rem;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0000;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3), inset 0 0 20px rgba(255, 0, 0, 0.1);
            animation: fade-in 1s ease-out;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Glitch effect for title */
        .glitch {
            font-size: 4rem;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
            position: relative;
            animation: glitch 2s infinite;
            margin-bottom: 2rem;
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
        }

        .intro-text {
            font-size: 1.2rem;
            line-height: 2;
            color: #ccc;
            margin-bottom: 2rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .start-button {
            font-size: 1.5rem;
            padding: 1rem 3rem;
            background: linear-gradient(45deg, #ff0000, #cc0000);
            color: white;
            border: 2px solid #ff4444;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .start-button:hover {
            background: linear-gradient(45deg, #cc0000, #990000);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        /* Game Over Screens */
        .escape-room.game-over {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-over.won {
            background: radial-gradient(circle at center, #001a00, #000000);
            animation: victory-pulse 2s ease-in-out infinite;
        }

        @keyframes victory-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .game-over.lost {
            background: radial-gradient(circle at center, #330000, #000000);
            animation: defeat-pulse 1s ease-in-out infinite;
        }

        @keyframes defeat-pulse {
            0%, 100% { filter: brightness(0.5); }
            50% { filter: brightness(0.8); }
        }

        .game-over-content {
            text-align: center;
            padding: 3rem;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid;
            border-radius: 15px;
            animation: slide-in 0.5s ease-out;
        }

        @keyframes slide-in {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .game-over.won .game-over-content {
            border-color: #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        .game-over.lost .game-over-content {
            border-color: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }

        .game-over-content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .game-over.won h1 {
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
        }

        .game-over.lost h1 {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }

        .game-over-content p {
            font-size: 1.5rem;
            margin: 1rem 0;
        }

        .game-over-content button {
            font-size: 1.3rem;
            padding: 0.8rem 2rem;
            margin-top: 1rem;
            background: #333;
            color: white;
            border: 2px solid #666;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .game-over-content button:hover {
            background: #555;
            transform: scale(1.05);
        }

        /* Playing State */
        .escape-room.playing {
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            border-radius: 10px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 5px;
            min-width: 120px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .timer.warning {
            color: #ffaa00;
            text-shadow: 0 0 15px #ffaa00;
            background: rgba(255, 170, 0, 0.1);
            animation: pulse-warning 1s infinite;
        }

        @keyframes pulse-warning {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .timer.critical {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            background: rgba(255, 0, 0, 0.2);
            animation: pulse-critical 0.5s infinite;
        }

        @keyframes pulse-critical {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
            }
        }

        .hints {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
            color: #ffaa00;
        }

        .hints button {
            padding: 0.5rem 1rem;
            background: #444;
            color: #ffaa00;
            border: 1px solid #ffaa00;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .hints button:hover:not(:disabled) {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 10px #ffaa00;
        }

        .hints button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress {
            font-size: 1.2rem;
            color: #00aaff;
            padding: 0.5rem 1rem;
            background: rgba(0, 170, 255, 0.1);
            border-radius: 5px;
        }

        /* Message Display */
        .message-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 1.5rem 3rem;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffaa00;
            border-radius: 10px;
            font-size: 1.5rem;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
            z-index: 1000;
            animation: message-appear 0.3s ease-out;
        }

        @keyframes message-appear {
            from {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* Room Container */
        .room-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-bottom: 1rem;
        }

        .room-view {
            width: 100%;
            height: 100%;
            border: 3px solid #333;
            border-radius: 10px;
            background: #0a0a0a;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .game-object {
            transition: all 0.3s ease;
            filter: brightness(1);
            cursor: pointer;
        }

        .game-object:hover {
            filter: brightness(1.5);
        }

        .game-object.examined rect {
            fill: #444;
        }

        .game-object:hover rect {
            stroke: #ffaa00;
            stroke-width: 1;
        }

        /* Examine Panel */
        .examine-panel {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00aaff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
            animation: slide-up 0.3s ease-out;
        }

        @keyframes slide-up {
            from { transform: translateX(-50%) translateY(50px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .examine-panel p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            color: #e0e0e0;
        }

        .examine-panel button {
            padding: 0.5rem 1.5rem;
            background: #00aaff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .examine-panel button:hover {
            background: #0088cc;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
        }

        /* Inventory */
        .inventory {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.5);
        }

        .inventory h3 {
            margin: 0 0 0.5rem 0;
            color: #00aaff;
            font-size: 1.3rem;
            text-shadow: 0 0 5px #00aaff;
        }

        .inventory-items {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            min-height: 60px;
        }

        .inventory-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem;
            background: #222;
            border: 2px solid #444;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
        }

        .inventory-item:hover {
            background: #333;
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
            transform: translateY(-2px);
        }

        .inventory-item.selected {
            background: #00aaff;
            border-color: #00ccff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.6);
            animation: item-selected 0.3s ease-out;
        }

        @keyframes item-selected {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .item-icon {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        .item-name {
            font-size: 0.9rem;
            text-align: center;
        }

        .empty-inventory {
            color: #666;
            font-style: italic;
            margin: 1rem;
        }

        .use-hint {
            margin-top: 0.5rem;
            color: #ffaa00;
            font-size: 0.9rem;
            text-align: center;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Puzzle Modal */
        .puzzle-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fade-in 0.3s ease-out;
        }

        .puzzle-content {
            padding: 2rem;
            background: #1a1a1a;
            border: 3px solid #ff0000;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
            min-width: 400px;
            text-align: center;
            animation: puzzle-appear 0.5s ease-out;
        }

        @keyframes puzzle-appear {
            from {
                transform: scale(0.8) rotateX(90deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotateX(0);
                opacity: 1;
            }
        }

        .puzzle-content h2 {
            color: #ff0000;
            text-shadow: 0 0 15px #ff0000;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .puzzle-content p {
            color: #ccc;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
        }

        .puzzle-content input {
            width: 200px;
            padding: 1rem;
            font-size: 2rem;
            text-align: center;
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5rem;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.1);
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .puzzle-content input:focus {
            outline: none;
            border-color: #00ffaa;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.5), inset 0 0 15px rgba(0, 255, 170, 0.2);
        }

        .puzzle-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .puzzle-buttons button {
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border: 2px solid;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .puzzle-buttons button:first-child {
            background: #00aa00;
            color: white;
            border-color: #00ff00;
        }

        .puzzle-buttons button:first-child:hover {
            background: #00cc00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            transform: scale(1.05);
        }

        .puzzle-buttons button:last-child {
            background: #aa0000;
            color: white;
            border-color: #ff0000;
        }

        .puzzle-buttons button:last-child:hover {
            background: #cc0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transform: scale(1.05);
        }

        /* Breathing effect for tension */
        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .escape-room.playing::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(139, 0, 0, 0.1) 100%);
            pointer-events: none;
            animation: breathe 4s ease-in-out infinite;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .glitch {
                font-size: 2.5rem;
            }

            .intro-text {
                font-size: 1rem;
            }

            .status-bar {
                flex-direction: column;
                gap: 0.5rem;
            }

            .puzzle-content {
                min-width: 90vw;
                padding: 1.5rem;
            }

            .puzzle-content input {
                width: 150px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Game State
        let gameState = {
            state: 'intro', // intro, playing, won, lost
            timeLeft: 3600,
            inventory: [],
            hints: 3,
            selectedItem: null,
            examineText: '',
            showPuzzle: null,
            puzzleInput: '',
            timer: null,
            puzzles: [
                { id: 'safe', name: 'Safe Password', solved: false },
                { id: 'clock', name: 'Clock Puzzle', solved: false },
                { id: 'painting', name: 'Painting Mystery', solved: false },
                { id: 'door', name: 'Final Password Door', solved: false }
            ],
            objects: [
                {
                    id: 'desk',
                    name: 'Desk',
                    x: 15, y: 60, width: 20, height: 25,
                    examined: false,
                    clue: 'You found a drawer containing a key and a note: "Time will reveal everything"',
                    givesItem: { id: 'key1', name: 'Bronze Key', description: 'An ancient bronze key', icon: '🔑' }
                },
                {
                    id: 'safe',
                    name: 'Safe',
                    x: 70, y: 40, width: 15, height: 20,
                    examined: false,
                    puzzle: 'safe',
                    clue: 'The safe requires a 4-digit password. The clock on the wall seems unusual...'
                },
                {
                    id: 'clock',
                    name: 'Old Clock',
                    x: 45, y: 15, width: 10, height: 15,
                    examined: false,
                    clue: 'The clock stopped at 3:27. Strangely, the hour and minute hands seem to be swapped...',
                    puzzle: 'clock'
                },
                {
                    id: 'painting',
                    name: 'Mysterious Painting',
                    x: 20, y: 20, width: 15, height: 20,
                    examined: false,
                    requiresItem: 'key1',
                    clue: 'A mechanism is hidden behind the painting! You discovered a sequence of numbers: 7-3-9-1',
                    givesItem: { id: 'code', name: 'Code Note', description: 'Written: 7391', icon: '📄' }
                },
                {
                    id: 'bookshelf',
                    name: 'Bookshelf',
                    x: 5, y: 30, width: 12, height: 40,
                    examined: false,
                    clue: 'You browsed through the books and found a diary. The last page reads: "The door password is the sum of all puzzle answers"'
                },
                {
                    id: 'door',
                    name: 'Exit Door',
                    x: 85, y: 55, width: 12, height: 30,
                    examined: false,
                    puzzle: 'door'
                }
            ]
        };

        const puzzleAnswers = {
            'safe': '7391',
            'clock': '327',
            'door': '8045'
        };

        const puzzleContent = {
            'safe': {
                title: 'Safe',
                description: 'Enter 4-digit password',
                placeholder: '____'
            },
            'clock': {
                title: 'Clock Puzzle',
                description: 'What secret does the clock hide? Enter the number you found',
                placeholder: '___'
            },
            'door': {
                title: 'Exit Door',
                description: 'The final password door. Enter the sum of all answers',
                placeholder: '____'
            }
        };

        const hintMessages = {
            'safe': 'Hint: Check behind the painting...',
            'clock': 'Hint: The time shown on the clock is the answer',
            'painting': 'Hint: The bronze key might be useful',
            'door': 'Hint: The diary on the bookshelf gives a clue'
        };

        // Utility Functions
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function showMessage(msg) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-display';
            messageDiv.textContent = msg;
            document.body.appendChild(messageDiv);
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // Game Functions
        function startGame() {
            gameState.state = 'playing';
            gameState.timeLeft = 3600;
            gameState.inventory = [];
            gameState.hints = 3;
            gameState.selectedItem = null;
            gameState.examineText = '';
            gameState.showPuzzle = null;
            gameState.puzzles.forEach(p => p.solved = false);
            gameState.objects.forEach(o => o.examined = false);

            render();
            startTimer();
        }

        function startTimer() {
            if (gameState.timer) clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                if (gameState.timeLeft <= 0) {
                    gameState.state = 'lost';
                    clearInterval(gameState.timer);
                    render();
                } else {
                    updateTimer();
                    checkWinCondition();
                }
            }, 1000);
        }

        function updateTimer() {
            const timerEl = document.querySelector('.timer');
            if (timerEl) {
                timerEl.textContent = '⏱️ ' + formatTime(gameState.timeLeft);
                timerEl.className = 'timer';
                if (gameState.timeLeft < 60) {
                    timerEl.classList.add('critical');
                } else if (gameState.timeLeft < 300) {
                    timerEl.classList.add('warning');
                }
            }
        }

        function checkWinCondition() {
            if (gameState.puzzles.every(p => p.solved)) {
                gameState.state = 'won';
                clearInterval(gameState.timer);
                render();
            }
        }

        function handleObjectClick(obj) {
            // If an item is selected, try to use it
            if (gameState.selectedItem) {
                if (obj.requiresItem === gameState.selectedItem) {
                    obj.examined = true;
                    gameState.examineText = obj.clue || `You carefully examined the ${obj.name}.`;

                    if (obj.givesItem && !gameState.inventory.find(item => item.id === obj.givesItem.id)) {
                        gameState.inventory.push(obj.givesItem);
                        showMessage(`Item obtained: ${obj.givesItem.name}`);
                    }
                    gameState.selectedItem = null;
                } else {
                    showMessage('This item cannot be used here');
                    gameState.selectedItem = null;
                }
                render();
                return;
            }

            // Normal interaction
            if (obj.requiresItem && !gameState.inventory.find(item => item.id === obj.requiresItem)) {
                showMessage(`You need an item to examine this. Try selecting an item first.`);
                return;
            }

            if (obj.puzzle) {
                gameState.showPuzzle = obj.puzzle;
                gameState.puzzleInput = '';
                render();
                return;
            }

            obj.examined = true;
            gameState.examineText = obj.clue || `You carefully examined the ${obj.name}, but found nothing special.`;

            if (obj.givesItem && !gameState.inventory.find(item => item.id === obj.givesItem.id)) {
                gameState.inventory.push(obj.givesItem);
                showMessage(`Item obtained: ${obj.givesItem.name}`);
            }

            render();
        }

        function handlePuzzleSubmit() {
            const answer = gameState.puzzleInput;
            const puzzleId = gameState.showPuzzle;

            if (answer === puzzleAnswers[puzzleId]) {
                const puzzle = gameState.puzzles.find(p => p.id === puzzleId);
                if (puzzle) puzzle.solved = true;

                showMessage('✓ Puzzle solved!');
                gameState.showPuzzle = null;
                gameState.puzzleInput = '';

                // Special handling for safe
                if (puzzleId === 'safe') {
                    const flashlight = {
                        id: 'flashlight',
                        name: 'Flashlight',
                        description: 'Can illuminate dark corners',
                        icon: '🔦'
                    };
                    if (!gameState.inventory.find(item => item.id === 'flashlight')) {
                        gameState.inventory.push(flashlight);
                    }
                }

                render();
            } else {
                showMessage('✗ Wrong password!');
                gameState.puzzleInput = '';
                render();
            }
        }

        function useHint() {
            if (gameState.hints <= 0) {
                showMessage('No hints left!');
                return;
            }

            gameState.hints--;
            const unsolvedPuzzle = gameState.puzzles.find(p => !p.solved);

            if (unsolvedPuzzle) {
                showMessage(hintMessages[unsolvedPuzzle.id] || 'Carefully observe every detail in the room');
            }

            render();
        }

        function selectItem(itemId) {
            gameState.selectedItem = gameState.selectedItem === itemId ? null : itemId;
            render();
        }

        // Render Functions
        function renderIntro() {
            return `
                <div class="escape-room intro">
                    <div class="intro-content">
                        <h1 class="glitch">ESCAPE ROOM</h1>
                        <p class="intro-text">
                            You wake up to find yourself trapped in a strange room...<br />
                            The room is filled with puzzles and clues<br />
                            You only have 60 minutes to escape<br />
                            <br />
                            Time is ticking...<br />
                            Can you escape?
                        </p>
                        <button class="start-button" onclick="startGame()">START GAME</button>
                    </div>
                </div>
            `;
        }

        function renderWon() {
            const timeUsed = 3600 - gameState.timeLeft;
            return `
                <div class="escape-room game-over won">
                    <div class="game-over-content">
                        <h1>🎉 Congratulations!</h1>
                        <p>You successfully escaped the room!</p>
                        <p>Time: ${formatTime(timeUsed)}</p>
                        <button onclick="startGame()">Play Again</button>
                    </div>
                </div>
            `;
        }

        function renderLost() {
            return `
                <div class="escape-room game-over lost">
                    <div class="game-over-content">
                        <h1>⏰ Time's Up!</h1>
                        <p>You failed to escape in time...</p>
                        <button onclick="startGame()">Retry</button>
                    </div>
                </div>
            `;
        }

        function renderPlaying() {
            const solvedCount = gameState.puzzles.filter(p => p.solved).length;
            const timerClass = gameState.timeLeft < 60 ? 'critical' : gameState.timeLeft < 300 ? 'warning' : '';

            return `
                <div class="escape-room playing">
                    <div class="status-bar">
                        <div class="timer ${timerClass}">
                            ⏱️ ${formatTime(gameState.timeLeft)}
                        </div>
                        <div class="hints">
                            💡 Hints: ${gameState.hints}
                            <button onclick="useHint()" ${gameState.hints === 0 ? 'disabled' : ''}>Use Hint</button>
                        </div>
                        <div class="progress">
                            Progress: ${solvedCount}/${gameState.puzzles.length}
                        </div>
                    </div>

                    <div class="room-container">
                        <svg class="room-view" viewBox="0 0 100 100">
                            <rect x="0" y="0" width="100" height="100" fill="#1a1a1a" />
                            <rect x="0" y="85" width="100" height="15" fill="#0d0d0d" />

                            ${gameState.objects.map((obj, index) => `
                                <g class="game-object ${obj.examined ? 'examined' : ''}"
                                   onclick="handleObjectClick(gameState.objects[${index}])">
                                    <rect x="${obj.x}" y="${obj.y}" width="${obj.width}" height="${obj.height}"
                                          fill="${obj.examined ? '#444' : '#333'}"
                                          stroke="${obj.examined ? '#666' : '#555'}"
                                          stroke-width="0.5" />
                                    <text x="${obj.x + obj.width/2}" y="${obj.y + obj.height/2}"
                                          font-size="2" fill="#aaa" text-anchor="middle"
                                          dominant-baseline="middle">${obj.name}</text>
                                    ${gameState.puzzles.find(p => p.id === obj.id && p.solved) ?
                                        `<text x="${obj.x + obj.width/2}" y="${obj.y - 2}" font-size="4" text-anchor="middle">✓</text>` : ''}
                                </g>
                            `).join('')}
                        </svg>

                        ${gameState.examineText ? `
                            <div class="examine-panel">
                                <p>${gameState.examineText}</p>
                                <button onclick="gameState.examineText = ''; render();">Close</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="inventory">
                        <h3>Inventory</h3>
                        <div class="inventory-items">
                            ${gameState.inventory.length === 0 ?
                                '<p class="empty-inventory">Empty</p>' :
                                gameState.inventory.map((item, index) => `
                                    <div class="inventory-item ${gameState.selectedItem === item.id ? 'selected' : ''}"
                                         onclick="selectItem('${item.id}')"
                                         title="${item.description}">
                                        <span class="item-icon">${item.icon}</span>
                                        <span class="item-name">${item.name}</span>
                                    </div>
                                `).join('')
                            }
                        </div>
                        ${gameState.selectedItem ? '<p class="use-hint">Click an object to use this item</p>' : ''}
                    </div>

                    ${gameState.showPuzzle ? renderPuzzleModal() : ''}
                </div>
            `;
        }

        function renderPuzzleModal() {
            const content = puzzleContent[gameState.showPuzzle];
            return `
                <div class="puzzle-modal">
                    <div class="puzzle-content">
                        <h2>${content.title}</h2>
                        <p>${content.description}</p>
                        <input type="text"
                               id="puzzleInput"
                               value="${gameState.puzzleInput}"
                               placeholder="${content.placeholder}"
                               maxlength="4"
                               oninput="gameState.puzzleInput = this.value"
                               autofocus />
                        <div class="puzzle-buttons">
                            <button onclick="handlePuzzleSubmit()">Confirm</button>
                            <button onclick="gameState.showPuzzle = null; gameState.puzzleInput = ''; render();">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            let html = '';

            switch(gameState.state) {
                case 'intro':
                    html = renderIntro();
                    break;
                case 'won':
                    html = renderWon();
                    break;
                case 'lost':
                    html = renderLost();
                    break;
                case 'playing':
                    html = renderPlaying();
                    break;
            }

            app.innerHTML = html;

            // Focus on puzzle input if shown
            if (gameState.showPuzzle) {
                setTimeout(() => {
                    const input = document.getElementById('puzzleInput');
                    if (input) input.focus();
                }, 100);
            }
        }

        // Initialize game
        render();
    </script>
</body>
</html>
